[project]
name = "pvcouncil"
version = "0.1.0"
description = "Prairie Village City Council document search"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5",
    "PyMuPDF>=1.24",
    "voyageai>=0.3",
    "anthropic>=0.40",
    "click>=8.0",
    "python-dotenv>=1.0",
    "mcp[cli]>=1.0",
]

[project.scripts]
pvc = "pvcouncil.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pvcouncil"]
